<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle des marchés</title>
<style>
:root{--bg:#0f1216;--card:#171b21;--line:#252b33;--ink:#e6e9ee;--mut:#8a94a3;--up:#2fb36d;--down:#e0524a;--warn:#e2a336;--acc:#5b9cf0;--chip:#20262e}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f5f7;--card:#fff;--line:#e3e6ea;--ink:#1b1f24;--mut:#667080;--chip:#eef1f4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
.mut{color:var(--mut)}.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
main{display:grid;gap:16px;padding:16px 20px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}
@media (max-width:1100px){.c7,.c5,.c6{grid-column:span 12}}
.big{font-size:26px;font-weight:700}.kpis{display:flex;flex-wrap:wrap;gap:22px}.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:17px;font-weight:600}
.books{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:800px){.books{grid-template-columns:1fr}}
.book h3{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}td.wrap{white-space:normal}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:var(--chip)}
.desk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.agent{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.agent .n{font-weight:600;font-size:13px}.agent .r{font-size:11px;color:var(--mut)}.agent .x{font-size:12px;margin-top:4px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-trade{border-left:4px solid var(--up)}.st-analyse{border-left:4px solid var(--acc)}.st-refuse{border-left:4px solid var(--warn)}.st-veille{border-left:4px solid var(--line);opacity:.7}
.legend span{margin-right:12px;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.grp{font-size:12px;color:var(--mut);margin:10px 0 6px}
.banner{padding:8px 10px;border-radius:8px;background:var(--chip);font-size:13px;margin-bottom:10px}
.feed{max-height:420px;overflow:auto}a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Salle des marchés</h1>
  <span class="chip">argent fictif</span>
  <span id="sync" class="mut"></span>
  <span class="mut" style="margin-left:auto"><a href="/full">vue détaillée</a> · <a href="/chart">graphiques</a></span>
</header>
<main>
  <section class="card c12">
    <div class="kpis" id="kpis"></div>
  </section>
  <section class="card c12"><h2>Portefeuilles</h2><div class="books" id="books"></div></section>
  <section class="card c12">
    <h2>Agents à leur poste</h2>
    <div class="legend mut"><span><i class="dot" style="background:var(--up)"></i>trade (ordre &lt; 5 min)</span><span><i class="dot" style="background:var(--acc)"></i>analyse</span><span><i class="dot" style="background:var(--warn)"></i>a refusé une entrée (&lt; 15 min)</span><span><i class="dot" style="background:var(--line)"></i>en veille</span></div>
    <div id="agents"></div>
  </section>
  <section class="card c7"><h2>Kronos : prévision des prochaines bougies</h2><div id="kronos"></div></section>
  <section class="card c5"><h2>Alertes et refus récents</h2><div id="alerts"></div></section>
  <section class="card c6"><h2>Positions ouvertes</h2><div id="positions"></div></section>
  <section class="card c6"><h2>Décisions en direct</h2><div class="feed" id="feed"></div></section>
</main>
<script>
// Rule (user 06/11): only real data. Missing = "pas de donnée", never a default that looks like a measurement.
const ND='<span class="mut">pas de donnée</span>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(v,d=2)=>v==null||isNaN(v)?null:Number(v).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=v=>v==null?ND:num(v)+' $';
const pct=(v,d=2)=>v==null?ND:`<span class="${v>0?'up':v<0?'down':''}">${v>0?'+':''}${num(v,d)} %</span>`;
const pts=v=>v==null?ND:`<span class="${v>0?'up':v<0?'down':''}">${v>0?'+':''}${num(v,2)} pts</span>`;
const ago=s=>s==null?'':s<90?`il y a ${Math.round(s)} s`:s<5400?`il y a ${Math.round(s/60)} min`:`il y a ${Math.round(s/3600)} h`;
const hhmm=t=>t?new Date(t*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
const ACT={BUY:'achat',SELL:'vente à découvert',CLOSE:'fermeture',REDUCE:'réduction',VETO:'refus',HALT:'arrêt',APPROVE:'accord'};

function render(d){
  const sAge=d.sync&&d.sync.at?Date.now()/1000-d.sync.at:null;
  document.getElementById('sync').innerHTML=`données du serveur ${sAge==null?ND:ago(sAge)}${d.sync&&d.sync.error?' · <span class="down">'+esc(d.sync.error)+'</span>':''}`;
  const btc=d.btc;
  document.getElementById('kpis').innerHTML=[
    ['Capital total',`<span class="big">${usd(d.total_equity)}</span>`],
    ['Depuis le départ ('+(btc?btc.since.split('-').reverse().slice(0,2).join('/'):'05/11')+')',pct(d.total_ret_pct)],
    ['BTC sur la même période',btc?pct(btc.pct)+` <span class="mut">(${num(btc.price,0)} $)</span>`:ND],
    ['Écart vs garder du BTC',(d.total_ret_pct!=null&&btc)?pts(d.total_ret_pct-btc.pct):ND],
    ['Décisions sur 24 h',d.n_today??ND]
  ].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');

  document.getElementById('books').innerHTML=d.books.map(b=>!b.available?`<div class="book"><h3>${esc(b.label)}</h3>${ND}</div>`:`
   <div class="book"><h3>${esc(b.label)} ${b.halted?'<span class="chip down">arrêté : '+esc(b.halted)+'</span>':''}</h3>
   <div class="kpis">
    <div class="kpi"><div class="l">Valeur</div><div class="v">${usd(b.equity)}</div></div>
    <div class="kpi"><div class="l">Rendement</div><div class="v">${pct(b.ret_pct)}</div></div>
    <div class="kpi"><div class="l">vs BTC</div><div class="v">${pts(b.vs_btc_pts)}</div></div>
    <div class="kpi"><div class="l">Investi</div><div class="v">${b.invested_pct==null?ND:num(b.invested_pct,1)+' %'}</div></div>
    <div class="kpi"><div class="l">Achat / vente à découvert</div><div class="v">${num(b.long_usd,0)} $ / ${num(b.short_usd,0)} $</div></div>
    <div class="kpi"><div class="l">Gain réalisé</div><div class="v">${b.pnl_closed==null?ND:usd(b.pnl_closed)}</div></div>
    <div class="kpi"><div class="l">Trades fermés · gagnants</div><div class="v">${b.n_trades??ND} · ${b.win_rate==null?ND:num(b.win_rate,0)+' %'}</div></div>
   </div></div>`).join('');

  const groups={};d.agents.forEach(a=>(groups[a.group]=groups[a.group]||[]).push(a));
  const lbl={trade:'trade',analyse:'analyse',refuse:'a refusé',veille:'en veille'};
  document.getElementById('agents').innerHTML=Object.entries(groups).map(([g,as])=>`<div class="grp">${esc(g)}</div><div class="desk">${as.map(a=>{
    const l=a.last, cyc=l&&l.action==='INFO'&&/^cycle termine/.test(l.reason||''), act=cyc?`dernier cycle ${ago(l.age_s)}`:l?`${ACT[l.action]||esc(l.action)} ${esc(l.symbol||'')}${l.age_s!=null?' · '+ago(l.age_s):''}`:(a.output_age_s!=null?`dernier résultat ${ago(a.output_age_s)}`:'aucune activité récente');
    return `<div class="agent st-${a.desk}" title="${esc(a.role)}${l&&l.reason?' — '+esc(l.reason):''}"><div class="n">${esc(a.label)} <span class="chip">${lbl[a.desk]}</span></div><div class="r">${esc(a.role)}</div><div class="x">${act}${l&&l.reason&&!cyc?' — '+esc(l.reason):''}</div></div>`}).join('')}</div>`).join('')
   +(d.planned&&d.planned.length?`<div class="grp">Pas encore construits : ${d.planned.map(esc).join(', ')}</div>`:'');

  const k=d.kronos;let kh='';
  if(k.status!=='ok'){kh=`<div class="banner">${esc(k.status==='pas de donnee'?'Pas de donnée':k.status)} — ${esc(k.why||'')}</div>`}
  else{
    const s=k.score_4h||{};
    kh=`<div class="banner">${k.trusted?'<b class="up">Fiable</b> : ses prévisions comptent dans les décisions.':'<b class="warn">En mesure</b> : ses prévisions ne servent pas encore à trader. Il le fera après ≥ 500 prévisions vérifiées sur 48 passes avec plus de 53 % de bonnes directions et un gain net positif.'}</div>
    <div class="kpis" style="margin-bottom:10px">
     <div class="kpi"><div class="l">Dernière passe</div><div class="v">${hhmm(k.at)} <span class="mut">(${k.markets_n} marchés, ${num(k.took_s,0)} s)</span></div></div>
     <div class="kpi"><div class="l">Prévisions 4 h vérifiées</div><div class="v">${s.n??0}</div></div>
     <div class="kpi"><div class="l">Bonnes directions</div><div class="v">${s.hit==null?ND:num(s.hit*100,1)+' %'}</div></div>
     <div class="kpi"><div class="l">Gain net si suivi</div><div class="v">${s.edge==null?ND:pct(s.edge,3)}</div></div>
    </div>
    <table><tr><th>Marché</th><th>Prix</th><th>+1 h</th><th>+4 h</th><th>+12 h</th><th>Accord des scénarios</th></tr>
    ${k.top.map(r=>`<tr><td><b>${esc(r.symbol)}</b></td><td>${r.price==null?ND:num(r.price,r.price<1?5:2)}</td><td>${pct(r.p1)}</td><td>${pct(r.p4)}</td><td>${pct(r.p12)}</td><td>${r.agree==null?ND:num(r.agree*100,0)+' %'}</td></tr>`).join('')}</table>
    <div class="mut" style="font-size:12px;margin-top:6px">Les 12 prévisions les plus marquées, sur ${k.markets_n} marchés. Accord = part des scénarios simulés qui vont dans le même sens à 4 h.</div>`;
  }
  document.getElementById('kronos').innerHTML=kh;

  document.getElementById('alerts').innerHTML=d.alerts.length?`<table>${d.alerts.map(a=>`<tr><td class="mut">${hhmm(a.at)}</td><td>${esc(a.agent)}</td><td>${esc((a.symbol||'').replace('USDT',''))}</td><td class="wrap">${esc(a.reason)}</td></tr>`).join('')}</table>`:'<span class="mut">aucune alerte récente</span>';

  const pos=[];d.books.forEach(b=>(b.positions||[]).forEach(p=>pos.push({...p,book:b.label.split(' (')[0]})));
  document.getElementById('positions').innerHTML=pos.length?`<table><tr><th>Portefeuille</th><th>Marché</th><th>Sens</th><th>Taille</th><th>Entrée</th><th>Actuel</th><th>Résultat</th></tr>
   ${pos.map(p=>`<tr><td class="mut">${esc(p.book)}</td><td><b>${esc(p.symbol)}</b></td><td>${p.side==='SHORT'?'vente à découvert':'achat'}</td><td>${usd(p.usd)}</td><td>${p.entry==null?ND:num(p.entry,p.entry<1?5:2)}</td><td>${p.last==null?ND:num(p.last,p.last<1?5:2)}</td><td>${pct(p.pnl_pct)}</td></tr>`).join('')}</table>`:'<span class="mut">aucune position ouverte</span>';

  document.getElementById('feed').innerHTML=d.feed.length?`<table>${d.feed.map(e=>`<tr><td class="mut">${hhmm(e.ts)}</td><td>${esc(e.agent)}</td><td><span class="chip ${e.action==='VETO'||e.action==='HALT'?'warn':e.action==='CLOSE'?'':'up'}">${ACT[e.action]||esc(e.action)}</span></td><td><b>${esc((e.symbol||'').replace('USDT',''))}</b></td><td class="wrap">${esc(e.reason)}${typeof e.result==='number'&&e.action==='CLOSE'?` <span class="${e.result>0?'up':'down'}">(${e.result>0?'+':''}${num(e.result,2)} $)</span>`:''}</td></tr>`).join('')}</table>`:'<span class="mut">aucune décision récente</span>';
}
async function tick(){try{const r=await fetch('/api/room',{cache:'no-store'});render(await r.json())}catch(e){document.getElementById('sync').innerHTML='<span class="down">serveur du tableau de bord injoignable</span>'}}
tick();setInterval(tick,15000);
</script>
</body>
</html>
