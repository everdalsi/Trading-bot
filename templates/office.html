<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradbot • Claude Office</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .desk { animation: work 3s infinite alternate ease-in-out; }
    @keyframes work { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); } }
    .status-dot { animation: pulse 2s infinite; }
    .avatar { transition: all 0.3s; }
    .avatar.working { filter: drop-shadow(0 0 12px #22c55e); }
  </style>
</head>
<body class="bg-[#0a0f1c] text-white font-mono">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-4xl font-bold text-center mb-8 flex items-center justify-center gap-3">
      🏢 Tradbot • <span class="text-cyan-400">Claude Office</span>
      <span class="px-4 py-1 bg-green-500/20 text-green-400 text-sm rounded-full border border-green-400 flex items-center gap-2">
        <span class="status-dot w-3 h-3 bg-green-400 rounded-full"></span> LIVE
      </span>
    </h1>

    <!-- Agents avec avatars + statut -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mb-8">
      <div class="bg-[#1a2333] p-6 rounded-3xl border border-cyan-400/30 text-center">
        <div class="avatar text-6xl mb-3">🧠</div>
        <div class="font-bold">Reflection</div>
        <div id="ref-status" class="text-cyan-400 text-sm mt-1 flex items-center justify-center gap-2">
          <span class="status-dot w-2 h-2 bg-cyan-400 rounded-full"></span> Analyse cycles
        </div>
      </div>
      <div class="bg-[#1a2333] p-6 rounded-3xl border border-yellow-400/30 text-center">
        <div class="avatar text-6xl mb-3">🔒</div>
        <div class="font-bold">Permission</div>
        <div id="perm-status" class="text-yellow-400 text-sm mt-1 flex items-center justify-center gap-2">
          <span class="status-dot w-2 h-2 bg-yellow-400 rounded-full"></span> Vérifie risque
        </div>
      </div>
      <div class="bg-[#1a2333] p-6 rounded-3xl border border-purple-400/30 text-center">
        <div class="avatar text-6xl mb-3">🛠️</div>
        <div class="font-bold">Improver</div>
        <div id="imp-status" class="text-purple-400 text-sm mt-1 flex items-center justify-center gap-2">
          <span class="status-dot w-2 h-2 bg-purple-400 rounded-full"></span> Construit patch
        </div>
      </div>
      <div class="bg-[#1a2333] p-6 rounded-3xl border border-emerald-400/30 text-center">
        <div class="avatar text-6xl mb-3">📈</div>
        <div class="font-bold">Trader</div>
        <div id="trader-status" class="text-emerald-400 text-sm mt-1 flex items-center justify-center gap-2">
          <span class="status-dot w-2 h-2 bg-emerald-400 rounded-full"></span> Trade en cours
        </div>
      </div>
      <div class="bg-[#1a2333] p-6 rounded-3xl border border-orange-400/30 text-center">
        <div class="avatar text-6xl mb-3">🛡️</div>
        <div class="font-bold">Risk</div>
        <div id="risk-status" class="text-orange-400 text-sm mt-1 flex items-center justify-center gap-2">
          <span class="status-dot w-2 h-2 bg-orange-400 rounded-full"></span> Monitoring
        </div>
      </div>
      <div class="bg-[#1a2333] p-6 rounded-3xl border border-amber-400/30 text-center">
        <div class="avatar text-6xl mb-3">👑</div>
        <div class="font-bold">Supervisor</div>
        <div id="sup-status" class="text-amber-400 text-sm mt-1 flex items-center justify-center gap-2">
          <span class="status-dot w-2 h-2 bg-amber-400 rounded-full"></span> Orchestre
        </div>
      </div>
    </div>

    <!-- Données concrètes -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-[#1a2333] p-5 rounded-3xl text-center">
        <div class="text-xs text-gray-400">LEÇONS</div>
        <div id="lessons" class="text-4xl font-bold text-green-400">1248</div>
      </div>
      <div class="bg-[#1a2333] p-5 rounded-3xl text-center">
        <div class="text-xs text-gray-400">WINRATE</div>
        <div id="winrate" class="text-4xl font-bold text-yellow-400">21.4%</div>
      </div>
      <div class="bg-[#1a2333] p-5 rounded-3xl text-center">
        <div class="text-xs text-gray-400">CAPITAL</div>
        <div id="capital" class="text-4xl font-bold text-cyan-400">$1,052.58</div>
      </div>
      <div class="bg-[#1a2333] p-5 rounded-3xl text-center">
        <div class="text-xs text-gray-400">CYCLE</div>
        <div id="cycle" class="text-4xl font-bold text-purple-400">47</div>
      </div>
    </div>

    <!-- Chat Slack propre -->
    <div class="bg-[#1a2333] rounded-3xl p-6">
      <div class="text-xs uppercase text-gray-400 mb-4">Office Chat • Agents en direct</div>
      <div id="chat" class="space-y-4 max-h-80 overflow-y-auto text-sm"></div>
    </div>
  </div>

  <script>
    // Mise à jour live (simulation réaliste)
    let lessons = 1248;
    let cycle = 47;

    function addChat(text, agent) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'flex gap-3';
      div.innerHTML = `<span class="text-xs w-24 text-right text-gray-400">${agent}</span><div class="flex-1 bg-[#334155] px-4 py-3 rounded-2xl">${text}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    setInterval(() => {
      cycle++;
      lessons += Math.floor(Math.random()*6)+2;
      document.getElementById('cycle').textContent = cycle;
      document.getElementById('lessons').textContent = lessons;
      document.getElementById('winrate').textContent = (21 + Math.random()*1.5).toFixed(1) + '%';
      document.getElementById('capital').textContent = '$' + (1052 + Math.random()*30).toFixed(2);

      const msgs = [
        ["Analyse des 12 derniers cycles terminée ✅", "Reflection"],
        ["Risque classé Low — patch autorisé", "Permission"],
        ["Patch appliqué sur trader_agent.py", "Improver"],
        ["Nouveau scalp rapide lancé sur SOL", "Trader"],
        ["Drawdown sous contrôle", "Risk"],
        ["MAX TRADES toujours actif", "Supervisor"]
      ];
      const r = msgs[Math.floor(Math.random()*msgs.length)];
      addChat(r[0], r[1]);
    }, 3200);

    // Messages de démarrage
    addChat("Bureau initialisé — tous les agents sont opérationnels", "System");
  </script>
</body>
</html>
