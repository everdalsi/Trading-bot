<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradbot • Claude Office</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; font-family: 'Courier New', monospace; }
    .office {
      transform: rotateX(55deg) rotateZ(45deg);
      transform-style: preserve-3d;
      image-rendering: pixelated;
    }
    .desk {
      animation: work 4s infinite alternate ease-in-out;
    }
    @keyframes work {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    .agent { font-size: 28px; transition: all 0.3s; }
  </style>
</head>
<body class="text-white">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-4xl font-bold text-center mb-8 flex items-center justify-center gap-3">
      🏢 Tradbot • Claude Office
      <span id="status" class="text-green-400 text-sm font-mono">● LIVE</span>
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Bureau isométrique -->
      <div class="lg:col-span-2 bg-[#1e2937] rounded-3xl p-8 shadow-2xl overflow-hidden">
        <div class="office bg-[#334155] w-full aspect-video rounded-2xl relative border-8 border-[#0f172a] flex items-center justify-center">
          
          <!-- Desks -->
          <div class="grid grid-cols-3 gap-8 text-center">
            <!-- Reflection -->
            <div class="desk flex flex-col items-center">
              <div class="text-5xl mb-2">🧠</div>
              <div class="text-xs font-bold bg-blue-600 px-3 py-1 rounded">Reflection</div>
              <div id="ref-status" class="text-green-400 text-[10px] mt-1">Analysing cycles...</div>
            </div>

            <!-- Permission Officer -->
            <div class="desk flex flex-col items-center">
              <div class="text-5xl mb-2">🔒</div>
              <div class="text-xs font-bold bg-red-600 px-3 py-1 rounded">Permission Officer</div>
              <div id="perm-status" class="text-yellow-400 text-[10px] mt-1">Checking risk...</div>
            </div>

            <!-- Senior Improver -->
            <div class="desk flex flex-col items-center">
              <div class="text-5xl mb-2">🛠️</div>
              <div class="text-xs font-bold bg-purple-600 px-3 py-1 rounded">Senior Improver</div>
              <div id="imp-status" class="text-green-400 text-[10px] mt-1">Working on patches...</div>
            </div>

            <!-- Trader, Risk, Supervisor -->
            <div class="desk flex flex-col items-center">
              <div class="text-5xl mb-2">📈</div>
              <div class="text-xs font-bold bg-emerald-600 px-3 py-1 rounded">Trader</div>
            </div>
            <div class="desk flex flex-col items-center">
              <div class="text-5xl mb-2">🛡️</div>
              <div class="text-xs font-bold bg-orange-600 px-3 py-1 rounded">Risk</div>
            </div>
            <div class="desk flex flex-col items-center">
              <div class="text-5xl mb-2">👑</div>
              <div class="text-xs font-bold bg-amber-600 px-3 py-1 rounded">Supervisor</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Panneau Slack-like -->
      <div class="bg-[#1e2937] rounded-3xl p-6 flex flex-col h-[520px]">
        <div class="text-xs uppercase tracking-widest mb-4 text-gray-400">Office Chat • Self-Improvement</div>
        <div id="chat" class="flex-1 overflow-y-auto space-y-4 text-sm font-mono"></div>
        
        <div class="mt-6 text-xs text-gray-400">
          Leçons : <span id="lessons" class="font-bold text-green-400">0</span> | 
          Cycle : <span id="cycle" class="font-bold">0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simulation live (tu peux remplacer par un fetch sur /metrics si tu veux)
    let cycle = 12;
    let lessons = 847;

    function addChatMessage(text, agent) {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = 'flex gap-2';
      msg.innerHTML = `
        <div class="text-xs w-20 text-right text-gray-400">${agent}</div>
        <div class="flex-1 bg-[#334155] px-4 py-2 rounded-2xl">${text}</div>
      `;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    // Mise à jour live
    setInterval(() => {
      cycle++;
      lessons += Math.floor(Math.random()*3);
      document.getElementById('cycle').textContent = cycle;
      document.getElementById('lessons').textContent = lessons;

      // Exemple de messages
      if (Math.random() > 0.7) {
        addChatMessage("Classification risque : Medium - demande permission utilisateur", "Permission Officer");
      }
      if (Math.random() > 0.8) {
        addChatMessage("Patch prêt sur trader_agent.py (niveau Low)", "Senior Improver");
      }
    }, 4500);

    // Message de bienvenue
    addChatMessage("Bureau initialisé – tous les agents sont en place", "System");
  </script>
</body>
</html>
