services:
  - type: worker
    name: trading-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: ANTHROPIC_KEY
        sync: false
      - key: BINANCE_KEY
        sync: false
      - key: BINANCE_SECRET
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Persistance de l'etat: save_data committe sim_portfolio_v7.json sur GitHub.
      # GITHUB_TOKEN = PAT classic scope repo -> valeur a coller dans le dashboard Render.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: everdalsi/Trading-bot
